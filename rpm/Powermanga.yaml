Name:    Powermanga
Summary: An arcade 2D shoot-em-up game
Version: 0.93.1
Release: 0
Group: Games
License: GPLv3+
URL: https://github.com/brunonymous/Powermanga
SCM: https://github.com/brunonymous/Powermanga
Sources:
    - '%{name}-%{version}.tar.gz'
#Patches:
#  # prefi handling is somehow onky, we just hardcode in this patch
#  - 'datadir.patch'
#  # make the volume controls work
#  - 'sdl-audio-pulse-role.patch'
#  # default is using MOD files for music, SFOS SDL2_mixer cannot handle that
#  - 'sdl-audio-oggfiles.patch'
#  - 'sdl-window-cmake.patch'
#  - 'sdl-window.patch'
#  # react to finger presses etc.
#  - 'sdl-touchinput.patch'
Description: |
    Powermanga is an arcade 2D shoot-em-up game with 41 levels and more
    than 200 sprites.

    %if "%{?vendor}" == "chum"
    Type: desktop-application
    DeveloperName: TLK Games
    PackagedBy: nephros
    Categories:
     - Game
     - Arcade
    Custom:
      Repo: %{url}
      PackagingRepo: https://github.com/nephros/Powermanga
    PackageIcon: %{url}/master/icons/%{name}.svg
    Screenshots:
      - https://libregamewiki.org/images/4/43/Powermanga_linux1.png
    %endif

PkgBR:
  - cmake
  - extra-cmake-modules
PkgConfigBR:
  - sdl2
  - SDL2_mixer
  - SDL2_ttf
  # SDL2_gfx
  # egl
  - wayland-client # for the landscape fix
  - wayland-egl

Configure: cmake
Builder:   none
RunFdupes:
  - '%{_datadir}/powermanga'
ConfigOptions:
  # sdl must be on for sdl2 to be used:
  - -DPOWERMANGA_SDL=ON
  - -DPOWERMANGA_SDL2=ON
  # game uses MOD files for music, SFOS SDL2_mixer cannot handle that
  - -DUSE_SDLMIXER=ON
  # -DUSE_SDLMIXER=OFF
NoIconCache: true
#BuildArch: noarch
Files:
  - '%license COPYING'
  - '%{_bindir}/*'
  - '%{_datadir}/applications/*.desktop'
  - '%{_datadir}/icons/*/*/apps/*'
  - '%dir %{_datadir}/powermanga'
  - '%{_datadir}/powermanga/*'
  # we use the ogg file version
  - '%exclude %{_datadir}/powermanga/sounds/*.zik'


