Name:    harbour-powermanga
Summary: An arcade 2D shoot-em-up game
Version: 0.93.1
Release: 0
Group: Games
License: GPLv3+
URL: https://github.com/brunonymous/Powermanga
SCM: https://github.com/nephros/Powermanga
Sources:
    - '%{name}-%{version}.tar.gz'
#Patches:
Description: |
    Powermanga is an arcade 2D shoot-em-up game with 41 levels and more
    than 200 sprites.

    %if "%{?vendor}" == "chum"
    Type: desktop-application
    DeveloperName: TLK Games
    PackagedBy: nephros
    Categories:
     - Game
     - Arcade
    Custom:
      Repo: %{url}
      PackagingRepo: https://github.com/nephros/Powermanga
    PackageIcon: %{url}/master/icons/%{name}.svg
    Screenshots:
      - https://libregamewiki.org/images/4/43/Powermanga_linux1.png
    %endif

PkgBR:
  - cmake
  - extra-cmake-modules
  - sailfish-svg2png
PkgConfigBR:
  - sdl2
  - SDL2_mixer
  - SDL2_ttf
  # SDL2_gfx
  # egl
  - wayland-client # for the landscape fix
  - wayland-egl

Configure: cmake
Builder:   none
RunFdupes:
  - '%{_datadir}/%{name}'
ConfigOptions:
  - -Wno-dev
  # sdl must be on for sdl2 to be used:
  - -DPOWERMANGA_SDL=ON
  - -DPOWERMANGA_SDL2=ON
  - -DUSE_SDLMIXER=ON
NoIconCache: true
#BuildArch: noarch
Files:
  # '%license COPYING'
  - '%{_bindir}/*'
  - '%{_datadir}/applications/*.desktop'
  - '%{_datadir}/icons/*/*/apps/*.png'
  - '%dir %{_datadir}/%{name}'
  - '%{_datadir}/%{name}/*'
  - '%exclude %{_datadir}/icons/*/*/apps/*.svg'
  # we use the ogg file version
  - '%exclude %{_datadir}/%{name}/sounds/*.zik'


